
name: Deploy ARRIVAA Preview to Firebase Hosting

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: arrivaa-6bab1
          workload_identity_provider: projects/801361365320/locations/global/workloadIdentityPools/arrivaa-github-pool/providers/github
          service_account: github-deploy-855@arrivaa-6bab1.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.35.0

      - name: Deploy preview
        run: firebase hosting:channel:deploy "pr-${{ github.event.number }}" --project arrivaa-6bab1 --expires 7d --non-interactive
