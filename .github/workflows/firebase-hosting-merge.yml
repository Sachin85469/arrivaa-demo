
name: Deploy ARRIVAA to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: arrivaa-6bab1
          workload_identity_provider: projects/801361365320/locations/global/workloadIdentityPools/arrivaa-github-pool/providers/github
          service_account: github-deploy-855@arrivaa-6bab1.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.35.0

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project arrivaa-6bab1 --non-interactive
