  <text x="60" y="63" font-family="Poppins,Arial,sans-serif" font-size="11" font-weight="600" fill="#0284C7">NEXUS Core Alpha</text>
  
  <text x="44" y="300" font-family="Poppins,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Decentralized Sync Engine</text>
  <text x="44" y="325" font-family="Poppins,Arial,sans-serif" font-size="13" font-weight="500" fill="#64748B">ARRIVA Research &amp; Build Log</text>
