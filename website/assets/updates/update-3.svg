    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>

  <!-- Glowing geometric nodes / curves in brand purple and green -->
  <path d="M 40 250 Q 200 110 360 210 T 600 90" fill="none" stroke="url(#ug_line_2)" stroke-width="4.5" opacity="0.9"/>
  <circle cx="200" cy="110" r="8" fill="#0284C7"/>
