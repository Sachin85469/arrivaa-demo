<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="404 - Page Not Found · ARRIVA">
<title>404 — Page Not Found · ARRIVA</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7C3AED;
    --purple-hover: #6D28D9;
    --navy: #0F172A;
    --navy-muted: #475569;
    --paper: #F8F7FF;
    --surface: #FFFFFF;
    --line: #CBD5E1;
    --green: #10B981;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Poppins', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--navy);
    font-family: var(--font-sans);
    font-weight: 300;
    text-align: center;
    padding: 24px;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: linear-gradient(to right, rgba(203, 213, 225, 0.28) 1px, transparent 1px);
    background-size: calc((min(1180px, calc(100% - 48px))) / 12) 100%;
    background-position: center top;
    opacity: 0.7;
  }
  .card {
    position: relative;
    z-index: 1;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 48px 36px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
  }
  .label {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--purple);
    margin-bottom: 12px;
    display: inline-block;
  }
  .num {
    font-family: var(--font-mono);
    font-size: clamp(4.5rem, 15vw, 6.5rem);
    font-weight: 600;
    line-height: 1;
    color: var(--navy);
    letter-spacing: -0.05em;
    margin-bottom: 12px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 10px; color: var(--navy); }
  p { color: var(--navy-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 6px;
    background: var(--purple);
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.9rem;
    transition: background 0.2s, transform 0.2s;
  }
  .btn:hover { background: var(--purple-hover); transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="card">
    <span class="label">ERROR · 404</span>
    <div class="num">404</div>
    <h1>Page Not Found</h1>
    <p>The coordinate or destination you requested does not exist in our workshop directory.</p>
    <a class="btn" href="index.html">Return to ARRIVA</a>
  </div>
</body>
</html>
