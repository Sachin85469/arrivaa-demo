<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | ARRIVA</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#0A0D14',
            surface1: '#121622',
            surface2: '#181E2E',
            borderSubtle: 'rgba(255, 255, 255, 0.08)',
            accentViolet: '#8B5CF6',
            accentEmerald: '#10B981',
            textMain: '#F8FAFC',
            textMuted: '#94A3B8',
            textDim: '#64748B',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas text-textMain font-sans min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full p-8 rounded-3xl bg-surface1 border border-borderSubtle text-center flex flex-col items-center gap-5 shadow-2xl">
    <div class="w-12 h-12 rounded-2xl bg-surface2 border border-borderSubtle flex items-center justify-center p-2.5">
      <img src="assets/favicon.svg" alt="Arriva Logo" class="w-7 h-7">
    </div>
    <div class="flex flex-col gap-1">
      <span class="text-xs font-mono text-accentViolet font-semibold uppercase tracking-wider">Error 404</span>
      <h1 class="text-2xl font-bold text-white">Route Not Found</h1>
      <p class="text-xs text-textMuted mt-1 leading-relaxed">
        The trail or screen you are looking for has shifted coordinates or does not exist on this waypoint.
      </p>
    </div>
    <div class="pt-2 flex items-center gap-3 w-full">
      <a href="index.html" class="flex-1 py-3 rounded-xl bg-accentViolet hover:bg-violet-600 text-white font-bold text-xs transition-all shadow-lg shadow-accentViolet/20">
        Return to Home
      </a>
      <a href="privacy.html" class="py-3 px-4 rounded-xl bg-surface2 hover:bg-surface1 border border-borderSubtle text-textMuted hover:text-white font-semibold text-xs transition-colors">
        Privacy Policy
      </a>
    </div>
    <span class="text-[10px] font-mono text-textDim">&copy; 2026 Arriva Travel Companion</span>
  </div>
</body>
</html>
